global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "ingestion"
    static_configs:
      - targets: ["ingestion:9100"]

  - job_name: "agg-worker"
    static_configs:
      - targets: ["agg-worker:9101"]

  - job_name: "anomaly-worker"
    static_configs:
      - targets: ["anomaly-worker:9102"]

  - job_name: "api-server"
    static_configs:
      - targets: ["api-server:8000"]
