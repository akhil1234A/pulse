services:
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: pulsestream-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9094"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - pulsestream

  postgresql:
    image: postgres:16-alpine
    container_name: pulsestream-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: pulsestream
      POSTGRES_USER: pulsestream
      POSTGRES_PASSWORD: pulsestream
    volumes:
      - ./configs/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsestream -d pulsestream"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulsestream

  redis:
    image: redis:7-alpine
    container_name: pulsestream-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pulsestream

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pulsestream-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pulsestream

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pulsestream-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - pulsestream

  ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ingestion
    container_name: pulsestream-ingestion
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      METRICS_PORT: 9100
      INGESTION_SIMULATOR_ENABLED: "false"
      INGESTION_DEVTO_ENABLED: "true"
      INGESTION_DEVTO_POLL_INTERVAL: "15"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      REDDIT_CLIENT_ID: "${REDDIT_CLIENT_ID:-}"
      REDDIT_CLIENT_SECRET: "${REDDIT_CLIENT_SECRET:-}"
    ports:
      - "9100:9100"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../src:/app/src
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - pulsestream

  agg-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: pulsestream-agg-worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      REDIS_URL: "redis://redis:6379/0"
      POSTGRES_HOST: "postgresql"
      POSTGRES_PORT: 5432
      WORKER_MODULE: "src.workers.aggregation.main"
      METRICS_PORT: 9101
      WORKER_HEALTH_PORT: 9101
      LOG_LEVEL: "INFO"
    ports:
      - "9101:9101"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    volumes:
      - ../src:/app/src
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - pulsestream

  anomaly-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: pulsestream-anomaly-worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      REDIS_URL: "redis://redis:6379/0"
      POSTGRES_HOST: "postgresql"
      POSTGRES_PORT: 5432
      WORKER_MODULE: "src.workers.anomaly.main"
      METRICS_PORT: 9102
      WORKER_HEALTH_PORT: 9102
      LOG_LEVEL: "INFO"
    ports:
      - "9102:9102"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    volumes:
      - ../src:/app/src
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - pulsestream

  api-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: pulsestream-api-server
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      REDIS_URL: "redis://redis:6379/0"
      POSTGRES_HOST: "postgresql"
      POSTGRES_PORT: 5432
      API_HOST: "0.0.0.0"
      API_PORT: 8000
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ../src:/app/src
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - pulsestream

networks:
  pulsestream:
    name: pulsestream
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
